<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 구글 아이콘 라이브러리 설정 / Google Material Icons 라이브러리 추가-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
        /* ... 기존 스타일 유지 ... */
    <title>Document</title>
    <style>
        .video-container {
            text-align: center;
            background: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
        }

        .controls {
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            vertical-align: middle;
        }

        button:hover {
            background-color: #0056b3;
        }

        button span {
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <video id="my-video" width="900">
            <source src="./assets/main_baemin_reset.0d972b27.mp4" type="video/mp4">
            브라우저가 비디오 태그를 지원하지 않습니다.
        </video>

        <div class="controls">
            <button id="btn-play">재생</button>
            <button id="btn-stop">종료</button>
            <button id="btn-mute">
                <!-- 음소거 버튼의 아이콘 -->
                 <!--  클래스에 "material-symbols-outlined"를 추가하고, 
                   내용에는 원하는 아이콘의 이름을 넣습니다. 방법)구글아이콘에서 
                   제목에 빈칸은 _ 로, 대문자는 전부소문자로 입력해보세요~-->
                <span id="mute-icon" class="material-symbols-outlined">volume_up</span>
                <span id="mute-text">소리 끄기</span>
            </button>
        </div>

        <script>
            const video = document.getElementById('my-video');
            const playBtn = document.getElementById('btn-play');
            const stopBtn = document.getElementById('btn-stop');

            // 재생 버튼 클릭 시
            // 토글(Toggle): 하나의 버튼으로 두 가지 상태를 왔다 갔다 하게 만드는 핵심 로직입니다.
            playBtn.addEventListener('click', () => {
                // 만약 비디오가 멈춰있다면?
                if (video.paused) {
                    // 재생해라!
                    video.play();
                    // 버튼 글자를 바꿔라!
                    playBtn.textContent = '일시정지';
                } else {
                    // 재생 중이라면? 
                    // 멈춰라!
                    video.pause();
                    // 버튼 글자를 되돌려라!
                    playBtn.textContent = '재생';
                }
            });

            // 종료 버튼 클릭 시
            // currentTime: 비디오의 현재 위치를 초 단위로 조절합니다. 0으로 만들면 "정지" 후 "되감기" 효과가 납니다.
            stopBtn.addEventListener('click', () => {
                video.pause();          // 1. 일단 멈춤
                video.currentTime = 0;  // 2. 비디오 테이프를 맨 앞으로 감기(0초로 이동)
                playBtn.textContent = '재생'; // 버튼 텍스트 초기화
            });

            const muteBtn = document.getElementById('btn-mute');
            const muteIcon = document.getElementById('mute-icon');
            const muteText = document.getElementById('mute-text');

            // 음소거 토글 로직
            muteBtn.addEventListener('click', () => {
                video.muted = !video.muted;

                if (video.muted) {
                    // 무음 상태일 때
                    muteIcon.textContent = 'volume_off'; // 구글 아이콘 이름
                    muteText.textContent = '소리 켜기';
                } else {
                    // 소리가 날 때
                    muteIcon.textContent = 'volume_up';  // 구글 아이콘 이름
                    muteText.textContent = '소리 끄기';
                }
            });

            // 비디오 종료 시 버튼 상태 초기화 (보너스)
            // 이벤트 리스너: 비디오가 스스로 "나 끝났어!"(ended)라고 외치면 그때 반응하는 감시자입니다.
            video.addEventListener('ended', () => {
                playBtn.textContent = '재생';
            });
        </script>
    </div>
</body>

</html>
