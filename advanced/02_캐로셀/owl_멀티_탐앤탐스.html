<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/owl.carousel@2.3.4/dist/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/owl.carousel@2.3.4/dist/assets/owl.theme.default.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/owl.carousel@2.3.4/dist/owl.carousel.min.js"></script>
    <title>탐앤탐스</title>
</head>
<body>
    <div class="owl-carousel owl-theme">
    <div class="item">
        <img src="assets/1729499871291_[2_pëg.jpg" alt="">
        <h4>페퍼로니 플레인 프레즐</h4></div>
    <div class="item">
        <img src="assets/1756947181355_[í_p°g.jpg" alt=""><h4>탐의보감</h4></div>
    <div class="item">
        <img src="assets/1734587991390_20_n1g.png" alt=""><h4>Golden Mellow choux</h4></div>
    <div class="item">
        <img src="assets/1764219319884_[2_p´g.jpg" alt=""><h4>Sweet Tea Holiday</h4></div>
    <div class="item">
        <img src="assets/1764219255005_[2_p_g.jpg" alt=""><h4>크로와상 크로와상 샌드위치</h4></div>
   
</div>

<script>
    $('.owl-carousel').owlCarousel({
    stagePadding: 56,//기본값 0,왼쪽/오른쪽 끝 패딩 만큼 아이템이 보이게
    slideTransition:'linear',//기본값 'ease',전환방식정의
    //autoplay:true,//자동이동
    loop:true,//기본값 false,무한반복
    //rewind:false,//기본값 true, 무한반복이 아닐때 이전버튼 클릭시 첫번째 아이템으로 이동
    margin:16,//아이템의 오른쪽 여백
    //center:true,//가운데 아이템 활성화
    nav:true,//기본값 false, pre/next버튼
    // navText:['<img src="assets/btn-specialtheater-prev.png" alt="이전버튼">',
    //          '<img src="assets/btn-specialtheater-next.png" alt="다음버튼">'
    //         ],
    dots:false, //기본값 true, 인디케이터
    //mouseDrag:false,//기본값 true, Mouse darg enabled
    //touchdrag:false,//기본값 true, Touch darg enabled
    //화면 크기에 따라 보이는 이미지(items) 갯수
    responsive:{
        0:{
            items:1
        },
        600:{
            items:3 // 기본값:3
        },
        1000:{
            items:4
        }
    }
})
</script>
</body>
</html>
