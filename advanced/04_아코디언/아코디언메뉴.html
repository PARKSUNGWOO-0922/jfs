<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>아코디언 UI</title>
    <style>
      .accordion-item {
        border-bottom: 1px solid #ccc;
      }
      /* 아코디온 버튼 */
      .accordion-title {
        padding: 15px;
        cursor: pointer;
        background: #f0f0f0;
      }
      .accordion-title.active {
        background: royalblue;
        color: white;
      }
      /* 아코디언 내용 */
      .accordion-content {
        display: none;
        padding: 15px;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <h2>아코디언 UI</h2>

    <nav class="accordion">
      <ul class="accordion-item">
        <li class="accordion-title"><a href="#">메인메뉴1</a>
            <ul>
                <li><a href=""></a>서브메뉴1</li>
                <li><a href=""></a>서브메뉴2</li>
                <li><a href=""></a>서브메뉴3</li>
            </ul>
        </li>
        <li class="accordion-content"><a href="#">메인메뉴2</a>
            <ul>
                <li><a href=""></a>서브메뉴1</li>
                <li><a href=""></a>서브메뉴2</li>
                <li><a href=""></a>서브메뉴3</li>
            </ul>
        </li>
      </ul>
 
    <!--//.accordion -->

    <script>
        //버튼들을 선택
      const titles = document.querySelectorAll(".accordion-title");
        // 번튼들 중에서 특정 버튼을
      titles.forEach((title) => {
        //클릭하면
        title.addEventListener("click", function () {
          // 이미 열려 있는 title 모두 닫기
          titles.forEach((t) => t.classList.remove("active"));
          //모든 내용을 숨기기
          document .querySelectorAll(".accordion-content")
            .forEach((c) => (c.style.display = "none"));

          // 클릭된 title 활성화
          this.classList.add("active");

          // 제목 바로 다음 형제요소 → 내용 패널
          const content = this.nextElementSibling;
          //클릭한 버튼에 해당하는 내용만 보이기
          content.style.display = "block";
        });
      });
    </script>
  </body>
</html>
