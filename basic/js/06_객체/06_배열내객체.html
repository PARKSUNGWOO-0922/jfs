<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열내객체</title>
</head>
<body>
    <div id="car_list"></div>
    <Script>
        /* 
        배열의 값으로 객체 사용하기
            const 배열명 = [
                    {속성: 값, ...},
                    {속성: 값, ...},
                    ...
                    {속성: 값, ...}
                ];
        
        */
       
         // 선언부
       const car =[
           {name:'소나다', color:'파랑', speed:100}  ,
           {name:'지프', color:'빨강', speed:70}  ,
           {name:'파사트', color:'흰색', speed:150}  
        ];
        // 처리+출력
        const car_list = document.getElementById('car_list');

        for (let i = 0; i < car.length; i++) {
          car_list.innerHTML +=   `<h2>Car${i+1}</h2>
        <p>${car[i].name}</p>
        <p>${car[i].color}</p>
        <p>${car[i].speed}</p>`
            
        }
        /*
            innerHTML +=를 반복문 안에서 쓰면 매번 브라우저가 화면을 다시 그리느라 조금 힘들 수 있습니다. 
            데이터가 아주 많다면(예: 1,000개), 문자열 변수에 다 합친 다음에 반복문이 끝나고 
            한 번에 innerHTML에 넣어주는 것이 성능상 훨씬 좋습니다.

            예)
            let temp = ""; // 임시 바구니
            for (let i = 0; i < car.length; i++) {
            temp += `<h2>Car${i+1}</h2>...`; // 바구니에 차곡차곡 담기
            }
            car_list.innerHTML = temp; // 마지막에 한 번만 화면에 팍!
        
        */
        
       
       
        
    </Script>
</body>
</html>
