<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="var1">아이디1:getElementById</p>
    <p id="var2">아이디2:querySelector</p>

    <p class="var3">클래스3:getElementsByClassName</p>
    <p class="var4">클래스4:querySelectorAll</p>
    <p >p태그:getElementByTagName</p>
    <script>
        /* 
            1. 표준 내장 객체 (Standard Built-in Objects)
                자바스크립트 엔진이 실행될 때 아무런 설정 없이도 어디서든 즉시 사용할 수 있도록 
                미리 정의된 객체들입니다. 브라우저든, 서버(Node.js)든 자바스크립트가 돌아가는 곳이라면 공통으로 존재합니다.

            주요 종류:

            데이터 타입 관련: Object, Array, String, Number, Boolean

            계산 및 날짜 관련: Math, Date

            제어 관련: JSON, RegExp (정규표현식)

            특징: 어떤 환경에서든 동일한 동작을 보장합니다. 예를 들어 Math.random()은 크롬 브라우저에서도, 
                서버에서도 똑같이 난수를 생성합니다.

            2. BOM (Browser Object Model)
                브라우저 객체 모델은 자바스크립트가 웹 브라우저와 소통하기 위해 만들어진 객체들입니다. 
                브라우저 창을 제어하거나, 현재 주소창의 정보를 가져오는 등의 역할을 합니다.

            최상위 객체: window (BOM의 모든 것은 이 아래에 있습니다.)

            주요 구성 요소:

            window: 브라우저 창 그 자체. (예: window.alert(), window.open())

            location: 주소창 관련. 현재 URL을 가져오거나 페이지를 이동시킴. (예: location.href)

            navigator: 브라우저 정보, 위치 정보(GPS), 언어 설정 등.

            history: 뒤로 가기, 앞으로 가기 버튼 기능 제어.

            screen: 사용자의 모니터 해상도, 크기 정보.


            객체
                1. 표준 내장(Built-in) 객체: JS에서 제공!
                    - Date, Array, String, Math, Number, Boolean, ...
                2. BOM 객체: 웹브라우저 제공!
                    - window, location, ...
                    - DOM 객체: document
                3. 사용자 정의 객체: 개발자가 만들어서 사용!
                    - car, person, user, ...

            객체(object) 생성
                const obj = {
                    속성: 값,
                    ...
                } 
        */

        //객체 내에서 사용한 this는 객체 자신을 가리킨다.
        const car= {
            name:'소나타',
            speed:100,
            color:'white',
            start: function(){return `${this.name}가출발합니다.`},
            stop: function(a){return `속도가 100에서${a}로 줄었습니다.`},
            accel: function(a,b){return `속도가 ${a}에서 ${b}로 가속되었습니다.`}
        }
        //객체.메서드()
        document.write('잘가,write!');

        /* 
            단일 요소
                const 변수명 = document.getElementById('아이디명');
                const 변수명 = document.querySelector('CSS선택자');
            같은 요소가 여러 개
                const 변수명 = document.getElementsByClassName('클래스명')[인덱스];
                const 변수명 = document.getElementsByTagName('태그명').item(인덱스);
                const 변수명 = document.querySelectorAll('CSS선택자')[인덱스]; 
        */
       
        const var1= document.getElementById('var1');
        const var2= document.querySelector('#var2');

        const var3= document.getElementsByClassName('var3')[0];
        const var4= document.querySelectorAll('.var4').item(0);
        const var5= document.getElementsByTagName('p')[4];
        
        //innerHTML 속성:HTML의 요소에 내용 지정
        //  - HTML의 요소에 내용 지정(set)/가져오기(get)
        //  - HTML 태그 인식⭕
        // textContent 속성
        //  - HTML의 요소에 내용 지정
        //  - HTML 태그 인식❌

        //p태그 내용 가져오기
        //객체.innerHTML;(getter)
        console.log(var1.innerHTML);
        //객체.innerHTML  = 값;(setter)
        //var1.innerHTML = car.name;
        //var1.innerHTML = car.name+'입니다.';
        var1.innerHTML = `<b>${car.name}</b>입니다.`;//소나타입니다. HTML태그  인식


        //객체.textContent;(getter)
        console.log(var2.textContent);
        //객체.textContent  = 값;(setter)
        var2.textContent =`<b>${car.name}</b>입니다.`;//<b>소나타</b>입니다. HTML태그인식  안함

        var3.innerHTML = car.start();
        var4.innerHTML = car.stop(0);
        var5.innerHTML = car.accel(0,100);

        


    </script>
</body>
</html>
